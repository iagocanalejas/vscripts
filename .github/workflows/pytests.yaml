name: vscript code quality
on: [push]
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Install FFmpeg & HandBrakeCLI
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y ffmpeg handbrake-cli

            - name: Verify FFmpeg installation
              run: ffmpeg -version

            - name: Verify HandBrakeCLI installation
              run: HandBrakeCLI --version

            - uses: actions/setup-python@v7
              with:
                  python-version: "3.14"
                  cache: "pip"

            - name: Pre-commit checks
              uses: pre-commit/action@v3.0.1

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install pytest coverage
                  if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

            - name: Test package is installable
              run: pip install .

            - name: Pytest + Coverage
              run: |
                  TEST_ENV=true coverage run --source=. -m pytest &&
                  echo "=== Application Coverage ===" &&
                  coverage report --include="vscripts/*" -m &&
                  echo "=== Test Code Coverage (100% required) ===" &&
                  coverage report --include="tests/*" --fail-under=100
